[project]
name = "aegisq-pqc"
version = "1.4.0"
description = "Post-quantum cryptography engine — Hybrid ML-KEM + AES-256-GCM (FIPS 203)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "AC-Santiago", email = "acostasantiago311124578@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []
keywords = [
    "post-quantum",
    "cryptography",
    "ml-kem",
    "kyber",
    "pqc",
    "fips-203",
    "key-encapsulation",
    "lattice-cryptography",
    "aes-gcm",
    "rust",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage   = "https://github.com/AC-Santiago/AegisQ"
Repository = "https://github.com/AC-Santiago/AegisQ.git"
Issues     = "https://github.com/AC-Santiago/AegisQ/issues"

[tool.maturin]
manifest-path = "crates/aegisq-pyo3/Cargo.toml"
python-source = "."
module-name   = "aegisq._aegisq_core"
features      = ["pyo3/extension-module"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "crates/**/*.rs" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "maturin>=1.0,<2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
]
