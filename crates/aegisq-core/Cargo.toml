[package]
name    = "aegisq-core"
version = "1.6.0-rc1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
zeroize   = { workspace = true }
subtle    = { workspace = true }
sha3      = { workspace = true }
shake     = { workspace = true }
getrandom = { workspace = true }
aes-gcm   = { workspace = true }
base64    = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Criterion es solo para benches; no requiere alloc, pero usa std.
# Por eso va en dev-dependencies (la lib sigue siendo no_std).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "ntt"
harness = false

[[bench]]
name = "kem"
harness = false
